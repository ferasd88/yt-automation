<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "IBM Plex Sans Arabic", "Noto Sans Arabic", "DejaVu Sans", sans-serif; color: #fff; }
  .shot { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .shot img.bg { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; will-change: transform; }
  .grad { position: absolute; inset: 0; background:
      linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 55%, rgba(0,0,0,.72) 100%); }
  .dim { position: absolute; inset: 0; background: #000; }

  /* year card */
  .year { position: absolute; top: 300px; left: 90px; right: 90px; text-align: center; opacity: 0; }
  .year .v { font-size: 230px; font-weight: 700; line-height: 1; direction: ltr; display: inline-block; color: #FFD27A;
             text-shadow: 0 10px 50px rgba(0,0,0,.7); }
  .year .u { font-size: 80px; font-weight: 700; margin-inline-start: 18px; }
  .year .l { font-size: 50px; font-weight: 600; margin-top: 8px; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,.9); }
  .label { position: absolute; top: 330px; left: 90px; right: 90px; text-align: center; font-size: 66px; font-weight: 700; opacity: 0;
           text-shadow: 0 6px 30px rgba(0,0,0,.9); }
  .counter { position: absolute; top: 560px; left: 90px; right: 90px; text-align: center; opacity: 0; }
  .counter .n { font-size: 210px; font-weight: 700; color: #FFD27A; direction: ltr; display: inline-block; text-shadow: 0 10px 50px rgba(0,0,0,.7); }
  .counter .u { font-size: 90px; font-weight: 700; margin-inline-start: 18px; }
  .counter .l { font-size: 52px; font-weight: 600; margin-top: 10px; }

  /* timeline */
  .tl { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 42%, #1c2340 0%, #0a0d19 70%, #05060c 100%); }
  .tl h3 { position: absolute; top: 300px; left: 60px; right: 60px; text-align: center; font-size: 64px; font-weight: 700; line-height: 1.3; }
  .tl .axis { position: absolute; top: 860px; left: 150px; width: 780px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); direction: ltr; }
  .tl .seg { position: absolute; top: 0; height: 8px; border-radius: 4px; width: 0; }
  .tl .seg.a { background: #8FA3C8; }
  .tl .seg.b { background: #FFC24D; box-shadow: 0 0 24px rgba(255,190,70,.7); }
  .tl .pt { position: absolute; top: 4px; width: 0; height: 0; opacity: 0; }
  .tl .pt .dot { position: absolute; width: 44px; height: 44px; left: -22px; top: -22px; border-radius: 50%; background: #fff; border: 7px solid #0a0d19; box-shadow: 0 0 0 3px #fff; }
  .tl .pt .ic { position: absolute; width: 160px; left: -80px; bottom: 40px; text-align: center; }
  .tl .pt .nm { position: absolute; width: 260px; left: -130px; top: 46px; text-align: center; font-size: 42px; font-weight: 700; }
  .tl .pt .yr { position: absolute; width: 260px; left: -130px; top: 104px; text-align: center; font-size: 36px; color: #AEB8D0; direction: rtl; }
  .tl .gl { position: absolute; top: 1080px; font-size: 52px; white-space: nowrap; font-weight: 700; text-align: center; opacity: 0; direction: rtl; }
  .tl .gl.a { color: #B8C6E2; }
  .tl .gl.b { color: #FFC24D; }
  .tl .brk { position: absolute; top: 1050px; height: 22px; border: 4px solid; border-top: none; border-radius: 0 0 12px 12px; opacity: 0; }
  .tl .brk.a { border-color: #8FA3C8; }
  .tl .brk.b { border-color: #FFC24D; }
  .tl .verdict { display: none; }
  .tl h3.gold { color: #FFC24D; font-size: 76px; }

  /* salawat + subscribe card */
  .sal img.bg { filter: blur(14px) brightness(.38) saturate(.8); }
  .sal .card { position: absolute; top: 400px; left: 140px; right: 140px; padding: 70px 40px 64px; border-radius: 48px; text-align: center;
               background: rgba(12,14,24,.72); border: 2px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .sal .pr { font-size: 76px; font-weight: 700; line-height: 1.35; }
  .sal .pr span { color: #FFD27A; font-family: "Amiri", "IBM Plex Sans Arabic", serif; font-weight: 400; }
  .sal .btns { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 60px; direction: rtl; }
  .sal .sub { font-size: 50px; font-weight: 700; padding: 22px 54px; border-radius: 60px; background: #E62117; color: #fff; }
  .sal .like { width: 120px; height: 120px; border-radius: 60px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; }
  .sal .like svg { width: 64px; height: 64px; fill: #fff; }
  .sal .tap { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 6px solid #fff; opacity: 0; }

  .end .ec { position: absolute; top: 760px; left: 0; right: 0; text-align: center; opacity: 0; }
  .end .ec .b { font-size: 150px; font-weight: 700; }
  .end .ec .s { font-size: 46px; color: #D6DCE8; margin-top: 4px; }


  /* map */
  .mp { position: absolute; inset: 0; background: radial-gradient(ellipse 100% 70% at 50% 45%, #13203a 0%, #070b16 75%); }
  .mp h3 { position: absolute; top: 330px; left: 50px; right: 50px; text-align: center; font-size: 70px; font-weight: 700; line-height: 1.3; }
  .mp .box { position: absolute; top: 640px; left: 0; width: 1080px; height: 540px; overflow: hidden; }
  .mp .box img { position: absolute; left: 0; top: 0; width: 1080px; height: 540px; filter: saturate(.8) brightness(.75); }
  .mp svg { position: absolute; left: 0; top: 0; width: 1080px; height: 540px; overflow: visible; }
  .mp .lbl { position: absolute; font-size: 34px; font-weight: 700; white-space: nowrap; transform: translate(-50%, -150%);
             padding: 4px 16px; border-radius: 18px; background: rgba(0,0,0,.6); opacity: 0; }
  /* aerosol diagram */
  .ae { position: absolute; inset: 0; background: linear-gradient(#020617 0%, #0b1a3a 45%, #1d3a6b 75%, #2b4f86 100%); overflow: hidden; }
  .ae h3 { position: absolute; top: 290px; left: 50px; right: 50px; text-align: center; font-size: 64px; font-weight: 700; }
  .ae .layerlbl { position: absolute; top: 625px; inset-inline-end: 60px; font-size: 36px; font-weight: 700; color: #F5D76E; opacity: 0; }
  .ae .ground { position: absolute; left: -300px; right: -300px; top: 1420px; height: 900px; border-radius: 50% 50% 0 0; }
  .ae .temp { position: absolute; top: 1110px; left: 0; right: 0; text-align: center; font-size: 56px; font-weight: 700; opacity: 0; }
  .ttag { position: absolute; top: 244px; inset-inline-end: 70px; font-size: 28px; padding: 6px 18px; border-radius: 20px; background: rgba(0,0,0,.55);
          color: #D6DCE8; opacity: .9; }
  .ttl { position: absolute; inset: 0; padding: 0 100px 300px 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  .ttl .y { font-size: 120px; font-weight: 700; color: #9CC9FF; direction: ltr; }
  .ttl .t { font-size: 104px; font-weight: 700; line-height: 1.15; text-shadow: 0 8px 40px rgba(0,0,0,.8); }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #brand img { display: block; height: 62px; width: auto; }
  #brand { position: absolute; top: 236px; inset-inline-start: 60px; padding: 10px 18px; border-radius: 30px; font-size: 36px; font-weight: 700;
           background: rgba(0,0,0,.35); border: 1.5px solid rgba(255,255,255,.18); }
  #brand span { color: #FFC24D; }
  /* safe zone for TikTok / YouTube Shorts UI: centred; captions x 170-910, y 1120-1420 (clear of right-side buttons, bottom description, top icons) */
  #cap { position: absolute; top: 1120px; left: 170px; width: 740px; text-align: center; font-size: 56px; line-height: 1.42; font-weight: 700;
         text-wrap: balance; -webkit-text-stroke: 10px rgba(0,0,0,.85); paint-order: stroke fill; opacity: 0; }
  #cap b { color: #FFD27A; font-weight: 700; }
  .saw { font-family: "Amiri", serif; font-weight: 400; }
  #prog { position: absolute; top: 0; right: 0; height: 8px; background: #FFC24D; }
</style>
</head>
<body>
<div id="shots"></div>
<div id="flash"></div>
<div id="brand"><img id="brandlogo" alt=""></div>
<div id="cap"></div>
<div id="prog"></div>
<script>
let P, A, nodes = [];
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
const outBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inout = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const fmt = n => Math.round(n).toLocaleString("en-US");
const THUMB = '<svg viewBox="0 0 24 24"><path d="M2 21h4V9H2v12zm20-11a2 2 0 0 0-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L13.2 1 6.6 7.6C6.2 8 6 8.5 6 9v10a2 2 0 0 0 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7v-2z"/></svg>';

// timeline geometry: years on one axis (BC negative)
const Y0 = -2560, YC = -69, YM = 1969;
const AX = 780, AL = 150;
const X = y => AX - (y - Y0) / (YM - Y0) * AX;   // pyramid on the right, moon on the left (RTL)

function img(a) { return `<img class="bg" src="${A[a].src}" data-w="${A[a].w}" data-h="${A[a].h}">`; }

function init(data) {
  P = data.plan; A = data.assets;
  if (data.logo) document.getElementById("brandlogo").src = data.logo;
  const host = $("#shots");
  P.shots.forEach(sh => {
    const el = document.createElement("div");
    el.className = "shot";
    let h = "";
    if (sh.type === "image") {
      h += img(sh.asset) + `<div class="dim" style="opacity:${sh.dim || 0}"></div><div class="grad"></div>`;
      if (sh.year) h += `<div class="year"><div><span class="v">${sh.year.v}</span><span class="u">${sh.year.u}</span></div><div class="l">${sh.year.l}</div></div>`;
      if (sh.label) h += `<div class="label">${sh.label}</div>`;
      if (sh.tag) h += `<div class="ttag">${sh.tag}</div>`;
      if (sh.counter) h += `<div class="counter"><div><span class="n">0</span><span class="u">${sh.counter.u}</span></div><div class="l">${sh.counter.l}</div></div>`;
      // (end card removed: the «لمح» outro is appended to every Short)
    } else if (sh.type === "map") {
      el.classList.add("mp");
      const P2 = ([la, lo]) => [(lo + 180) / 360 * 1080, (90 - la) / 180 * 540];
      let svg = "";
      (sh.arcs || []).forEach((a, j) => {
        const [x1, y1] = P2(a.from), [x2, y2] = P2(a.to);
        const cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - 170;
        svg += `<path class="arc" d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="#FFC24D" stroke-width="7" stroke-linecap="round" style="filter:drop-shadow(0 0 8px rgba(255,190,70,.8))"/>`;
      });
      (sh.spots || []).forEach(p => { const [x, y] = P2(p.at);
        svg += `<g class="spot" transform="translate(${x},${y})"><circle r="${p.r || 26}" fill="${p.color || '#FF6B3D'}" opacity=".35"/><circle r="12" fill="${p.color || '#FF6B3D'}"/></g>`; });
      h += `<h3>${sh.title || ""}</h3><div class="box"><img src="${A[sh.asset].src}"><svg>${svg}</svg>${(sh.spots || []).map(p => {
        const [x, y] = P2(p.at); return `<div class="lbl" style="left:${x}px;top:${640 + y - 640}px;color:${p.color || '#fff'}">${p.label}</div>`; }).join("")}</div>`;
    } else if (sh.type === "aerosol") {
      el.classList.add("ae");
      let rays = "";
      for (let r = 0; r < 9; r++) {
        const x0 = 120 + r * 105;
        const reflect = r % 3 === 1;
        rays += reflect
          ? `<path class="ray rf" d="M${x0 - 140},160 L${x0},760 L${x0 + 140},380" fill="none" stroke="#FFD86B" stroke-width="8" stroke-linecap="round"/>`
          : `<path class="ray th" d="M${x0 - 140},160 L${x0 + 40},1440" fill="none" stroke="#FFE7A3" stroke-width="7" stroke-linecap="round"/>`;
      }
      let dots = "";
      for (let d = 0; d < 140; d++) { const x = (d * 97) % 1080, y = 720 + ((d * 53) % 80); dots += `<circle class="pt" cx="${x}" cy="${y}" r="${3 + (d % 4)}" fill="#F5D76E" opacity="0"/>`; }
      h += `<svg width="1080" height="1920" style="position:absolute;inset:0"><defs><radialGradient id="sun"><stop offset="0" stop-color="#FFF4C2"/><stop offset=".5" stop-color="#FFC24D"/><stop offset="1" stop-color="rgba(255,160,40,0)"/></radialGradient></defs>
            <circle cx="-20" cy="120" r="230" fill="url(#sun)"/>${rays}${dots}</svg>
            <h3>${sh.title || ""}</h3><div class="layerlbl">${sh.layer || ""}</div><div class="ground"></div><div class="temp">${sh.temp || ""}</div>`;
    } else if (sh.type === "title") {
      h += img(sh.asset).replace('class="bg"', 'class="bg" style="filter:blur(3px)"') + `<div class="dim" style="opacity:${sh.dim ?? .5}"></div><div class="ttl"><div class="y">${sh.year || ""}</div><div class="t">${sh.text}</div></div>`;
    } else if (sh.type === "salawat") {
      el.classList.add("sal");
      h += img(sh.asset) + `<div class="card"><div class="pr">صلِّ على النبي <span>ﷺ</span></div>
           <div class="btns"><div class="sub">اشتراك</div><div class="like">${THUMB}</div></div></div><div class="tap"></div>`;
    } else if (sh.type === "timeline") {
      el.classList.add("tl");
      const pts = [["giza", "الهرم الأكبر", "2560 ق.م", Y0], ["cleo_bust", "كليوباترا", "69 ق.م", YC], ["apollo_aldrin", "القمر", "1969 م", YM]];
      h += `<h3></h3><div class="axis"><div class="seg a"></div><div class="seg b"></div>${pts.map(p =>
            `<div class="pt" style="left:${X(p[3])}px"><div class="ic"><img src="${A[p[0]].src}" style="width:150px;height:150px;object-fit:cover;border-radius:50%;border:5px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.6)"></div><div class="dot"></div><div class="nm">${p[1]}</div><div class="yr">${p[2]}</div></div>`).join("")}</div>
            <div class="brk a"></div><div class="brk b"></div><div class="gl a">≈ 2,500 سنة</div><div class="gl b">≈ 2,000 سنة</div>
            <div class="verdict">أقرب إلى القمر… من الهرم!</div>`;
    }
    el.innerHTML = h;
    host.appendChild(el);
    nodes.push(el);
  });
}

function place(im, zoom, pan) {
  const W = +im.dataset.w, H = +im.dataset.h, base = Math.max(1080 / W, 1920 / H);
  const sw = W * base * zoom, sh = H * base * zoom;
  let dx = (0.5 - pan[0]) * sw, dy = (0.5 - pan[1]) * sh;
  const mx = (sw - 1080) / 2, my = (sh - 1920) / 2;
  dx = clamp(dx, -mx, mx); dy = clamp(dy, -my, my);
  im.style.width = W * base + "px"; im.style.height = H * base + "px";
  im.style.transform = `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${zoom})`;
}

function render(t) {
  let flash = 0;
  P.shots.forEach((sh, i) => {
    const el = nodes[i], s0 = sh.start, s1 = sh.end, d = s1 - s0;
    const XF = .16;
    const op = Math.min(clamp((t - s0 + XF) / XF), 1 - clamp((t - s1) / XF));
    el.style.opacity = op;
    if (op <= 0) return;
    const k = clamp((t - s0) / (d + XF));
    const im = el.querySelector("img.bg");
    if (im) {
      const z = sh.zoom || [1.0, 1.1];
      const kk = sh.flash ? out3(k * 1.6) : inout(k);
      const p = sh.pan || [[.5, .5], [.5, .5]];
      place(im, z[0] + (z[1] - z[0]) * kk, [p[0][0] + (p[1][0] - p[0][0]) * kk, p[0][1] + (p[1][1] - p[0][1]) * kk]);
    }
    if (sh.flash) flash = Math.max(flash, 1 - clamp((t - s0) / .22));
    const yr = el.querySelector(".year");
    if (yr) { const ky = outBack((t - s0 - .3) / .45); yr.style.opacity = clamp((t - s0 - .3) / .2); yr.style.transform = `scale(${.6 + .4 * ky})`; }
    const lb = el.querySelector(".label");
    if (lb) { const kl = out3((t - s0 - .15) / .4); lb.style.opacity = kl; lb.style.transform = `translateY(${(1 - kl) * 40}px)`; }
    const ct = el.querySelector(".counter");
    if (ct) {
      const kc = out3((t - s0 - .3) / 1.2);
      ct.style.opacity = clamp((t - s0 - .2) / .25);
      ct.querySelector(".n").textContent = (sh.counter.prefix || "") + fmt(sh.counter.to * kc);
      ct.style.transform = `scale(${.9 + .1 * outBack((t - s0 - .2) / .5)})`;
    }
    const ec = el.querySelector(".ec");
    if (ec) { const ke = out3((t - Math.max(s0 + .9, s1 - 1.6)) / .5); ec.style.opacity = ke; ec.style.transform = `scale(${.92 + .08 * ke})`; }
    if (sh.type === "salawat") {
      const card = el.querySelector(".card"), kc = outBack((t - s0) / .45);
      card.style.transform = `scale(${.7 + .3 * kc})`; card.style.opacity = clamp((t - s0) / .2);
      const tSub = s0 + d * .45, tLike = s0 + d * .68;
      const sub = el.querySelector(".sub"), like = el.querySelector(".like"), tap = el.querySelector(".tap");
      const ps = clamp((t - tSub) / .12) - clamp((t - tSub - .12) / .15);
      sub.style.transform = `scale(${1 - .1 * ps})`;
      if (t >= tSub + .1) { sub.textContent = "تم الاشتراك ✓"; sub.style.background = "#3a3d48"; } else { sub.textContent = "اشتراك"; sub.style.background = "#E62117"; }
      const pl = clamp((t - tLike) / .1) - clamp((t - tLike - .1) / .25);
      like.style.transform = `scale(${1 + .35 * pl})`;
      like.style.background = t >= tLike ? "#FFC24D" : "rgba(255,255,255,.12)";
      like.querySelector("svg").style.fill = t >= tLike ? "#111" : "#fff";
      // tap ring follows: subscribe then like
      const sr = sub.getBoundingClientRect(), lr = like.getBoundingClientRect();
      let tp = null, tt = 0;
      if (t >= tSub - .05 && t < tSub + .4) { tp = sr; tt = (t - tSub + .05) / .45; }
      if (t >= tLike - .05 && t < tLike + .4) { tp = lr; tt = (t - tLike + .05) / .45; }
      if (tp) { tap.style.opacity = 1 - tt; tap.style.left = (tp.left + tp.width / 2 - 45) + "px"; tap.style.top = (tp.top + tp.height / 2 - 45) + "px"; tap.style.transform = `scale(${.6 + tt})`; }
      else tap.style.opacity = 0;
    }
    if (sh.type === "map") {
      el.querySelectorAll("path.arc").forEach((pa, j) => {
        const L = pa.getTotalLength(), ka = out3((t - s0 - .35 - j * .35) / 1.1);
        pa.style.strokeDasharray = L; pa.style.strokeDashoffset = L * (1 - ka);
      });
      el.querySelectorAll("g.spot").forEach((g, j) => {
        const ks = outBack((t - s0 - .15 - j * .3) / .45), pulse = 1 + .25 * Math.sin((t - s0) * 5 + j);
        g.style.opacity = clamp((t - s0 - .15 - j * .3) / .2);
        g.querySelector("circle").setAttribute("transform", `scale(${Math.max(0, ks) * pulse})`);
      });
      el.querySelectorAll(".lbl").forEach((lb, j) => { lb.style.opacity = clamp((t - s0 - .5 - j * .3) / .3); });
      const h3 = el.querySelector("h3"), kh = out3((t - s0) / .4); h3.style.opacity = kh; h3.style.transform = `translateY(${(1 - kh) * 30}px)`;
      const im = el.querySelector(".box img"), z = 1 + .06 * inout(k); im.style.transform = `scale(${z})`;
    }
    if (sh.type === "aerosol") {
      const kl = clamp((t - s0 - .2) / 1.0);
      el.querySelectorAll("circle.pt").forEach((c, j) => { c.setAttribute("opacity", clamp(kl * 1.5 - (j % 7) * .1) * .9);
        c.setAttribute("cy", 720 + ((j * 53) % 80) + 6 * Math.sin((t + j) * 1.3)); });
      el.querySelector(".layerlbl").style.opacity = clamp((t - s0 - .8) / .4);
      el.querySelectorAll("path.ray").forEach((pa, j) => {
        const L = pa.getTotalLength(), kr = clamp((t - s0 - .6 - (j % 5) * .12) / 1.2);
        pa.style.strokeDasharray = "40 26"; pa.style.strokeDashoffset = -((t - s0) * 160) % 66;
        pa.style.opacity = clamp(kr * 1.5) * (pa.classList.contains("th") ? .55 : .95);
        const m = pa.getAttribute("d"); // clip progressive reveal via mask-like length
        pa.style.strokeDasharray = `${L * kr} ${L}`; pa.style.strokeDashoffset = 0;
      });
      const kc = clamp((t - s0 - 1.6) / 1.6);
      const warm = [196, 122, 64], cool = [74, 120, 170];
      const col = warm.map((w, i) => Math.round(w + (cool[i] - w) * kc));
      el.querySelector(".ground").style.background = `radial-gradient(ellipse at 50% 0%, rgb(${col}) 0%, rgb(${col.map(c => c * .45 | 0)}) 70%)`;
      el.querySelector(".temp").style.opacity = clamp((t - s0 - 2.0) / .4);
      const h3 = el.querySelector("h3"); h3.style.opacity = out3((t - s0) / .4);
    }
    if (sh.type === "title") {
      const tt = el.querySelector(".ttl"), kt = outBack((t - s0 - .1) / .5);
      tt.style.opacity = clamp((t - s0 - .1) / .2); tt.style.transform = `scale(${.75 + .25 * kt})`;
    }
    if (sh.type === "timeline") {
      el.style.transform = `scale(${1 + .045 * inout(k)})`;   // slow push-in so the frame never sits still
      const st = sh.stage;
      const h3 = el.querySelector("h3");
      h3.textContent = st === 1 ? "من الهرم… إلى كليوباترا" : st === 2 ? "ومن كليوباترا… إلى القمر" : "أقرب إلى القمر… من الهرم!";
      h3.className = st === 3 ? "gold" : "";
      if (st === 3) { const kv = outBack((t - s0 - .2) / .5); h3.style.transform = `scale(${.7 + .3 * kv})`; h3.style.opacity = clamp((t - s0 - .2) / .2); }
      else { h3.style.transform = "none"; h3.style.opacity = 1; }
      const pts = el.querySelectorAll(".pt");
      const segA = el.querySelector(".seg.a"), segB = el.querySelector(".seg.b");
      // stage 1 draws A, stage 2 draws B, stage 3 shows both + verdict
      const ka = st === 1 ? out3((t - s0 - .3) / 1.4) : 1;
      const kb = st === 1 ? 0 : st === 2 ? out3((t - s0 - .3) / 1.4) : 1;
      const wa = X(Y0) - X(YC), wb = X(YC) - X(YM);
      segA.style.left = (X(Y0) - wa * ka) + "px"; segA.style.width = wa * ka + "px";
      segB.style.left = (X(YC) - wb * kb) + "px"; segB.style.width = wb * kb + "px";
      pts[0].style.opacity = st === 1 ? out3((t - s0) / .3) : 1;
      pts[1].style.opacity = st === 1 ? out3((t - s0 - 1.4) / .3) : 1;
      pts[2].style.opacity = st === 1 ? .0 : st === 2 ? out3((t - s0 - 1.5) / .3) : 1;
      const ga = el.querySelector(".gl.a"), gb = el.querySelector(".gl.b"), ba = el.querySelector(".brk.a"), bb = el.querySelector(".brk.b");
      ba.style.left = AL + X(YC) + "px"; ba.style.width = wa + "px";
      bb.style.left = AL + X(YM) + "px"; bb.style.width = wb + "px";
      ga.style.left = AL + X(YC) + "px"; ga.style.width = wa + "px";
      gb.style.left = AL + X(YM) + "px"; gb.style.width = wb + "px";
      const kga = st === 1 ? out3((t - s0 - 1.6) / .4) : 1, kgb = st === 1 ? 0 : st === 2 ? out3((t - s0 - 1.7) / .4) : 1;
      ga.style.opacity = kga * (st === 3 ? .45 : 1); ba.style.opacity = kga * (st === 3 ? .45 : 1);
      gb.style.opacity = kgb; bb.style.opacity = kgb;
      if (st === 3) {
        const pulse = 1 + .06 * Math.sin((t - s0) * 6) * clamp((t - s0) / .5);
        gb.style.transform = `scale(${pulse})`;
        el.querySelector(".axis").style.transform = `scale(${1 + .03 * out3((t - s0) / .4)})`;
      }
    }
  });
  $("#flash").style.opacity = flash * .85;

  // captions: current narration line; numbers highlighted
  let idx = -1;
  P.lines.forEach((l, i) => { if (t >= l.start - .1) idx = i; });
  const cap = $("#cap");
  if (idx >= 0 && t <= P.lines[idx].end + .25 && P.lines[idx].id !== "salawat") {
    cap.innerHTML = P.lines[idx].caption.replace(/([0-9][0-9,]*)/g, "<b>$1</b>");
    const kc = out3((t - P.lines[idx].start + .1) / .18);
    cap.style.opacity = Math.min(kc, 1 - clamp((t - P.lines[idx].end - .1) / .15));
    cap.style.transform = `translateY(${(1 - kc) * 20}px)`;
  } else cap.style.opacity = 0;
  $("#prog").style.width = (t / P.total * 1080) + "px";
}
</script>
</body>
</html>
