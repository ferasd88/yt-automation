<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #141312; }
  #bg { position: absolute; inset: 0;
        background: radial-gradient(ellipse 85% 55% at 50% 47%, #262321 0%, #181716 55%, #0e0d0d 100%); }
  #glow { position: absolute; left: 50%; top: 47%; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%;
          background: radial-gradient(circle, rgba(205,126,76,.32) 0%, rgba(205,126,76,.10) 35%, rgba(205,126,76,0) 65%); opacity: 0; }
  #grain { position: absolute; inset: 0; opacity: .05; }
  /* logo stage: the 1254x1254 source canvas, drawn at 860px */
  #stage { position: absolute; left: 50%; top: 47%; width: 860px; height: 860px; margin: -430px 0 0 -430px; }
  #stage img, #sheen { position: absolute; inset: 0; width: 100%; height: 100%; }
  #sheen { -webkit-mask-size: 100% 100%; mask-size: 100% 100%; opacity: 0; }
  #ring { position: absolute; border-radius: 50%; border: 6px solid rgba(205,126,76,.9); opacity: 0; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="grain" width="540" height="960" style="width:1080px;height:1920px"></canvas>
<div id="glow"></div>
<div id="stage">
  <img id="letters"><img id="stop"><img id="sbot"><img id="tri"><img id="orig"><div id="sheen"></div>
  <div id="ring"></div>
</div>
<div id="fade"></div>
<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const expo = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const S = 860 / 1254;                       // source px -> stage px
let D = 1.3;

function init(d) {
  $("#letters").src = d.letters; $("#stop").src = d.stop; $("#sbot").src = d.sbot; $("#tri").src = d.tri; $("#orig").src = d.orig;
  const sh = $("#sheen");
  sh.style.webkitMaskImage = `url(${d.letters})`; sh.style.maskImage = `url(${d.letters})`;
  // triangle centre in source coords (729..851, 587..714) -> ring position
  const cx = (729 + 851) / 2 * S, cy = (587 + 714) / 2 * S;
  const r = $("#ring"); r.style.left = (cx - 90) + "px"; r.style.top = (cy - 90) + "px"; r.style.width = r.style.height = "180px";
  D = d.duration || 1.3;
}

function grain(t) {          // subtle animated film grain (deterministic)
  const c = $("#grain").getContext("2d"), img = c.createImageData(540, 960);
  let s = Math.floor(t * 30) * 7919 + 1;
  for (let i = 0; i < img.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s & 255; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; }
  c.putImageData(img, 0, 0);
}

function render(t) {
  grain(t);
  // slashes fly in from opposite sides along their own angle (~ -10deg)
  const ks = expo((t - 0.00) / 0.34);
  const dx = (1 - ks) * 620, dy = (1 - ks) * 110;
  $("#stop").style.transform = `translate(${dx}px, ${-dy}px) scaleX(${1 + .35 * (1 - ks)})`;
  $("#sbot").style.transform = `translate(${-dx}px, ${dy}px) scaleX(${1 + .35 * (1 - ks)})`;
  $("#stop").style.opacity = $("#sbot").style.opacity = clamp(t / 0.08);

  // letters: diagonal wipe right->left (Arabic reading direction), parallel to the slashes
  const kl = out3((t - 0.12) / 0.38);
  const edge = 1254 * 1.25 * (1 - kl) - 160;      // x of the wipe front in source px
  const sl = 260;                                   // slant offset
  const x0 = Math.max(-300, edge) * S, x1 = Math.max(-300, edge - sl) * S;
  $("#letters").style.clipPath = `polygon(${x0}px 0, 900px 0, 900px 900px, ${x1}px 900px)`;
  $("#letters").style.transform = `translateY(${(1 - kl) * 16}px)`;

  // triangle pop (play button) on the second note
  const kt = back((t - 0.42) / 0.22);
  $("#tri").style.transformOrigin = `${(729 + 851) / 2 * S}px ${(587 + 714) / 2 * S}px`;
  $("#tri").style.transform = `scale(${Math.max(0, kt)})`;
  $("#tri").style.opacity = clamp((t - 0.42) / 0.05);
  const kr = clamp((t - 0.44) / 0.42), ring = $("#ring");
  ring.style.opacity = (1 - kr) * (t >= 0.44 ? .85 : 0); ring.style.transform = `scale(${0.5 + 2.2 * out3(kr)})`;

  // glow breathes up at the pop, then settles
  const kg = clamp((t - 0.05) / 0.4) * (0.75 + 0.25 * Math.exp(-Math.pow((t - 0.5) / 0.18, 2)) * 1.6);
  $("#glow").style.opacity = Math.min(1, kg);

  // specular sheen across the letters
  const kh = clamp((t - 0.55) / 0.45);
  const pos = -40 + 180 * kh;
  $("#sheen").style.background = `linear-gradient(105deg, rgba(255,255,255,0) ${pos - 14}%, rgba(255,255,255,.55) ${pos}%, rgba(255,255,255,0) ${pos + 14}%)`;
  $("#sheen").style.opacity = kh > 0 && kh < 1 ? 1 : 0;

  // settle: very gentle push-in; from 0.95s the untouched original PNG is shown (pixel-exact logo)
  const z = 1.0 + 0.02 * out3(t / D);
  $("#stage").style.transform = `scale(${z})`;
  const ko = clamp((t - 0.92) / 0.06);
  $("#orig").style.opacity = ko;
  ["#letters", "#stop", "#sbot", "#tri"].forEach(s => $(s).style.visibility = ko >= 1 ? "hidden" : "visible");
}
</script>
</body>
</html>
